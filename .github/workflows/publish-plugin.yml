name: Publish codegen plugin

# Run by hand (Actions > Publish codegen plugin > Run workflow) after the release
# workflow's Maven Central deployment has been published in the Central Portal.
# Generated code calls the libraries, so the plugin must never be live before
# they are: this workflow refuses to run until the version is on Maven Central.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the "v" (must equal VERSION_NAME at tag v<version>)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-plugin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the plugin from the release tag, so it matches the published libraries.
          ref: v${{ inputs.version }}

      - name: Version must equal VERSION_NAME
        run: |
          version_name="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          if [ "${VERSION}" != "${version_name}" ]; then
            echo "::error::Input version ${VERSION} does not match VERSION_NAME=${version_name} at tag v${VERSION}."
            exit 1
          fi

      - name: Libraries must already be on Maven Central
        run: |
          group_path="$(sed -n 's/^GROUP=//p' gradle.properties | tr . /)"
          for module in bunting-verify bunting bunting-android bunting-debug; do
            url="https://repo1.maven.org/maven2/${group_path}/${module}/${VERSION}/${module}-${VERSION}.pom"
            if ! curl --silent --fail --head --output /dev/null "${url}"; then
              echo "::error::${module} ${VERSION} is not on Maven Central yet (${url}). Publish the deployment in the Central Portal, wait for it to sync, then rerun."
              exit 1
            fi
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to the Gradle Plugin Portal
        run: ./gradlew -p bunting-codegen-gradle build publishPlugins --stacktrace
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
