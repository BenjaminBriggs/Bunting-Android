# AndroidX is required by the AGP modules (:bunting-android uses androidx.lifecycle-process).
android.useAndroidX=true

# AGP + lint + dex merging need more than the 512m default heap on a full build.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

# Release version: the single source of truth for the libraries, the bunting-cli
# distribution, and the codegen plugin (bunting-codegen-gradle reads this file).
# The release workflow fails unless the pushed tag is v<VERSION_NAME>.
VERSION_NAME=1.0.0

# Maven Central coordinates and POM metadata, read by com.vanniktech.maven.publish
# for :bunting-verify, :bunting, :bunting-android and :bunting-debug. Artifact IDs
# are the module names. See docs/releasing.md.
GROUP=io.github.benjaminbriggs
POM_URL=https://github.com/BenjaminBriggs/Bunting-Android
POM_INCEPTION_YEAR=2026
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/BenjaminBriggs/Bunting-Android
POM_SCM_CONNECTION=scm:git:https://github.com/BenjaminBriggs/Bunting-Android.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/BenjaminBriggs/Bunting-Android.git
POM_DEVELOPER_ID=BenjaminBriggs
POM_DEVELOPER_NAME=Benjamin Briggs
POM_DEVELOPER_URL=https://github.com/BenjaminBriggs

# Upload to the Central Portal as a deployment that is released by hand in the
# portal UI (no automatic release). Credentials and the signing key are passed
# as ORG_GRADLE_PROJECT_* environment variables by the release workflow.
mavenCentralPublishing=true
mavenCentralAutomaticPublishing=false
signAllPublications=true
